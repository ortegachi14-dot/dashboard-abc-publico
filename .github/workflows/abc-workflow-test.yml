
name: ABC dashboard diario

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: abc-workflow-test
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/abc-workflow
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Verify input files
        run: |
          test -f notion_jugadores.csv
          test -f Base_Maestra_ABC.csv
          test -f V08_2_copa_promesas.py
          test -f V09_minutos_club_tijuana_Pyto_v3.py
          test -f generar_dashboard_clasificacion_Pyto_ABC_FICHA_JUGADOR_CONTRATO_OCULTO.py
          python - <<'PY'
          import csv
          from pathlib import Path

          def rows(path):
              with Path(path).open(encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          notion = rows("notion_jugadores.csv")
          master = rows("Base_Maestra_ABC.csv")
          assert len(notion) == 126, f"Notion: {len(notion)} filas; se esperaban 126"
          assert len(master) == 126, f"Base ABC: {len(master)} filas; se esperaban 126"
          print(f"Entradas verificadas: Notion={len(notion)}, Base ABC={len(master)}")
          PY

      - name: Run V08.2 extraction
        run: python V08_2_copa_promesas.py

      - name: Validate V08.2 outputs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          base = Path("V08_copa_promesas/resultados")
          players_file = base / "jugadores_consolidados.csv"
          participations_file = base / "participaciones.csv"
          assert players_file.is_file(), f"No se generó {players_file}"
          assert participations_file.is_file(), f"No se generó {participations_file}"

          with players_file.open(encoding="utf-8-sig", newline="") as f:
              players = list(csv.DictReader(f))
          with participations_file.open(encoding="utf-8-sig", newline="") as f:
              participations = list(csv.DictReader(f))

          assert len(players) == 126, f"V08 generó {len(players)} jugadores; se esperaban 126"
          print(f"V08 validado: {len(players)} jugadores y {len(participations)} participaciones")
          PY

      - name: Run V09 consolidation
        run: python V09_minutos_club_tijuana_Pyto_v3.py

      - name: Validate V09 output
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("V09_resultados/jugadores_consolidados_v09.csv")
          assert path.is_file(), f"No se generó {path}"
          with path.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 126, f"V09 generó {len(rows)} jugadores; se esperaban 126"
          print(f"V09 validado: {len(rows)} jugadores")
          PY

      - name: Generate ABC dashboard
        run: python generar_dashboard_clasificacion_Pyto_ABC_FICHA_JUGADOR_CONTRATO_OCULTO.py

      - name: Assemble test artifact
        run: |
          test -s ABC/ABC_Ficha_Jugador_Oculto.html
          mkdir -p artifact/assets
          cp ABC/ABC_Ficha_Jugador_Oculto.html artifact/index.html
          if [ -d ABC/assets/players ]; then
            cp -R ABC/assets/players artifact/assets/players
          fi
          python - <<'PY'
          from pathlib import Path
          html = Path("artifact/index.html").read_text(encoding="utf-8")
          assert html.strip(), "El HTML generado está vacío"
          assert "__DATA__" not in html, "El HTML conserva un marcador de datos sin reemplazar"
          assets = Path("artifact/assets/players")
          photos = len([p for p in assets.iterdir() if p.is_file()]) if assets.exists() else 0
          print(f"HTML generado: {len(html)} caracteres")
          print(f"Archivos de fotos copiados: {photos}")
          PY

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: abc-dashboard-test
          path: artifact/
          if-no-files-found: error
          retention-days: 7
